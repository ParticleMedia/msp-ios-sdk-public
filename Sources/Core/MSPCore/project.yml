# MSPCore XcodeGen Project Specification
# Uses shared template and adds MSPCore-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: MSPCore

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MSPCore
    PRODUCT_BUNDLE_IDENTIFIER: msp.MSPCore
    PRODUCT_MODULE_NAME: MSPCore

targets:
  MSPCore:
    type: framework
    platform: iOS
    sources:
      - path: MSPCore
        excludes:
          - "**/*.h"
          - "**/*.modulemap"
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
    dependencies:
      - framework: ../../../Build/XCFrameworks/MSPiOSCore.xcframework
        embed: false
      - framework: ../ThirdParty/Kingfisher/Kingfisher.xcframework
        embed: false
      - framework: ../ThirdParty/SnapKit/SnapKit.xcframework
        embed: false
      - framework: ../ThirdParty/Lottie/Lottie.xcframework
        embed: false
      - framework: ../ThirdParty/Shimmer/Shimmer.xcframework
        embed: false
      - framework: ../ThirdParty/SwiftProtobuf/SwiftProtobuf.xcframework
        embed: false
      - framework: ../../../Build/XCFrameworks/MSPSharedLibraries.xcframework
        embed: false
      - framework: ../MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: ../../../Sources/Core/MSPOMSDK/OMSDK_Newsbreak1.xcframework
        embed: false
      # Note: MSPPrebidAdapter is now a source pod, not an XCFramework
      # MSPCore.xcframework needs to be rebuilt to remove this XCFramework dependency
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        
        # Framework Search Paths - XCFrameworks only
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ThirdParty/Kingfisher
          - $(SRCROOT)/../ThirdParty/SnapKit
          - $(SRCROOT)/../ThirdParty/Lottie
          - $(SRCROOT)/../ThirdParty/Shimmer
          - $(SRCROOT)/../ThirdParty/SwiftProtobuf
          - $(SRCROOT)/../../../Build/XCFrameworks
          - $(SRCROOT)/../MSPSharedLibraries
          - $(SRCROOT)/../MSPOMSDK

schemes:
  MSPCore:
    build:
      targets:
        MSPCore: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
