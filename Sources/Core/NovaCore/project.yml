# NovaCore XcodeGen Project Specification
# Uses shared template and adds NovaCore-specific overrides
# Template: Config/xcodegen/module.project_template.yml
# NO PODS DEPENDENCIES - Uses only XCFramework dependencies

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: NovaCore

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: NovaCore
    PRODUCT_BUNDLE_IDENTIFIER: msp.NovaCore
    PRODUCT_MODULE_NAME: NovaCore
    
    # Framework Search Paths - ONLY XCFramework paths, NO Pods
    # Note: ThirdParty frameworks (Kingfisher, SnapKit, Lottie, Shimmer) are automatically
    # added to FRAMEWORK_SEARCH_PATHS via the dependencies section, so we don't need to list them here
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../../../Build/XCFrameworks

targets:
  NovaCore:
    type: framework
    platform: iOS
    sources:
      - path: NovaCore
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "NovaCore.docc/**"
    dependencies:
      - framework: ../MSPOMSDK/OMSDK_Newsbreak1.xcframework
        embed: false
      - framework: ../ThirdParty/Kingfisher/Kingfisher.xcframework
        embed: false
      - framework: ../ThirdParty/SnapKit/SnapKit.xcframework
        embed: false
      - framework: ../ThirdParty/Lottie/Lottie.xcframework
        embed: false
      - framework: ../ThirdParty/Shimmer/Shimmer.xcframework
        embed: false
    settings:
      base:
        # Module-specific Swift flags
        OTHER_SWIFT_FLAGS: $(inherited) -no-verify-emitted-module-interface

schemes:
  NovaCore:
    build:
      targets:
        NovaCore: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
