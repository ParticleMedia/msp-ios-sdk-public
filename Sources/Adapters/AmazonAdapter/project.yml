# AmazonAdapter XcodeGen Project Specification
# Uses shared template and adds AmazonAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: AmazonAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: AmazonAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.AmazonAdapter
    PRODUCT_MODULE_NAME: AmazonAdapter

targets:
  AmazonAdapter:
    type: framework
    platform: iOS
    sources:
      - path: AmazonAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "AmazonAdapter.docc/**"
    dependencies:
      - framework: ../../../../../../../../Build/XCFrameworks/MSPiOSCore.xcframework
        embed: false
      - framework: ../../../../../Pods/AmazonPublisherServicesSDK/APS_iOS_SDK-4.5.5/DTBiOSSDK.xcframework
        embed: false
      - framework: ../../../../../Pods/Google-Mobile-Ads-SDK/Frameworks/GoogleMobileAdsFramework/GoogleMobileAds.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Framework Search Paths - Include MSPiOSCore XCFramework
        # AmazonAdapter depends on MSPiOSCore, which is located in MSPSharedLibraries
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../../../../../../../Build/XCFrameworks/MSPiOSCore.xcframework
          - $(SRCROOT)/../../../../../Pods/AmazonPublisherServicesSDK/APS_iOS_SDK-4.5.5/DTBiOSSDK.xcframework
          - $(SRCROOT)/../../../../../Pods/Google-Mobile-Ads-SDK/Frameworks/GoogleMobileAdsFramework/GoogleMobileAds.xcframework
    configFiles:
      Debug: "../../../../../Pods/Target Support Files/Pods-AmazonAdapter/Pods-AmazonAdapter.debug.xcconfig"
      Release: "../../../../../Pods/Target Support Files/Pods-AmazonAdapter/Pods-AmazonAdapter.release.xcconfig"
    prebuildScripts:
      - name: "[CP] Check Pods Manifest.lock"
        script: |
          if [ -z "${PODS_PODFILE_DIR_PATH}" ] || [ -z "${PODS_ROOT}" ]; then
            echo "error: CocoaPods environment variables are not set." >&2
            exit 1
          fi
          if [ ! -e "${PODS_ROOT}/Manifest.lock" ] || [ ! -e "${PODS_PODFILE_DIR_PATH}/Podfile.lock" ]; then
            echo "error: Run 'pod install' to generate Pods/Manifest.lock." >&2
            exit 1
          fi
          if ! diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" >/dev/null; then
            echo "error: The sandbox is not in sync with the Podfile.lock. Run 'pod install' or update your CocoaPods installation." >&2
            exit 1
          fi
        shell: /bin/sh
        inputFiles:
          - ${PODS_PODFILE_DIR_PATH}/Podfile.lock
          - ${PODS_ROOT}/Manifest.lock
    postbuildScripts:
      - name: "[CP] Copy Pods Resources"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-AmazonAdapter/Pods-AmazonAdapter-resources.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-AmazonAdapter/Pods-AmazonAdapter-resources.sh"
          fi
        shell: /bin/sh
      - name: "[CP] Embed Pods Frameworks"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-AmazonAdapter/Pods-AmazonAdapter-frameworks.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-AmazonAdapter/Pods-AmazonAdapter-frameworks.sh"
          fi
        shell: /bin/sh

schemes:
  AmazonAdapter:
    build:
      targets:
        AmazonAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
