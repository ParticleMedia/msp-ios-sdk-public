# MSPGoogleAdapter XcodeGen Project Specification
# Uses shared template and adds MSPGoogleAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: MSPGoogleAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MSPGoogleAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.MSPGoogleAdapter
    PRODUCT_MODULE_NAME: MSPGoogleAdapter

targets:
  MSPGoogleAdapter:
    type: framework
    platform: iOS
    sources:
      - path: MSPGoogleAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "GoogleAdapter.docc/**"
    dependencies:
      - framework: ../../../Build/XCFrameworks/MSPiOSCore.xcframework
        embed: false
      - framework: ../../Core/MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: ../../../Pods/Google-Mobile-Ads-SDK/Frameworks/GoogleMobileAdsFramework/GoogleMobileAds.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../../../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/../../..
        
        # Framework Search Paths - Include MSPiOSCore, PrebidMobile, and GoogleMobileAds XCFrameworks
        # MSPGoogleAdapter depends on MSPiOSCore and PrebidMobile (in MSPSharedLibraries) and GoogleMobileAds (Pod-provided XCFramework)
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../../Build/XCFrameworks/MSPiOSCore.xcframework
          - $(SRCROOT)/../../Core/MSPSharedLibraries/PrebidMobile.xcframework
          - $(SRCROOT)/../../../Pods/Google-Mobile-Ads-SDK/Frameworks/GoogleMobileAdsFramework/GoogleMobileAds.xcframework
    configFiles:
      Debug: "../../../Pods/Target Support Files/Pods-MSPGoogleAdapter/Pods-MSPGoogleAdapter.debug.xcconfig"
      Release: "../../../Pods/Target Support Files/Pods-MSPGoogleAdapter/Pods-MSPGoogleAdapter.release.xcconfig"

schemes:
  MSPGoogleAdapter:
    build:
      targets:
        MSPGoogleAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
