# PrebidAdapter XcodeGen Project Specification
# Uses shared template and adds PrebidAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: PrebidAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MSPPrebidAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.PrebidAdapter
    PRODUCT_MODULE_NAME: MSPPrebidAdapter

targets:
  PrebidAdapter:
    type: framework
    platform: iOS
    sources:
      - path: PrebidAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "PrebidAdapter.docc/**"
    dependencies:
      - framework: ../../../Build/XCFrameworks/MSPiOSCore.xcframework
        embed: false
      - framework: ../../Core/MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../../../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/../../..
        
        # Framework Search Paths - Include PrebidMobile and MSPiOSCore XCFrameworks
        # PrebidAdapter depends on PrebidMobile and MSPiOSCore, which are located in MSPSharedLibraries
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../../Build/XCFrameworks/MSPiOSCore.xcframework
          - $(SRCROOT)/../../Core/MSPSharedLibraries/PrebidMobile.xcframework
    configFiles:
      Debug: "../../../Pods/Target Support Files/Pods-PrebidAdapter/Pods-PrebidAdapter.debug.xcconfig"
      Release: "../../../Pods/Target Support Files/Pods-PrebidAdapter/Pods-PrebidAdapter.release.xcconfig"

schemes:
  PrebidAdapter:
    build:
      targets:
        PrebidAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
