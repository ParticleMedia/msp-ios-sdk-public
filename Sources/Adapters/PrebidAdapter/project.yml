# PrebidAdapter XcodeGen Project Specification
# Uses shared template and adds PrebidAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: PrebidAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MSPPrebidAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.PrebidAdapter
    PRODUCT_MODULE_NAME: MSPPrebidAdapter

targets:
  PrebidAdapter:
    type: framework
    platform: iOS
    sources:
      - path: PrebidAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "PrebidAdapter.docc/**"
    dependencies:
      - framework: ../../../Build/XCFrameworks/MSPiOSCore.xcframework
        embed: false
      - framework: ../../Core/MSPOMSDK/OMSDK_Newsbreak1.xcframework
        embed: false
      - framework: ../../Core/MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        
        # Framework Search Paths - XCFrameworks only
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../../Build/XCFrameworks
          - $(SRCROOT)/../../Core/MSPOMSDK
          - $(SRCROOT)/../../Core/MSPSharedLibraries

schemes:
  PrebidAdapter:
    build:
      targets:
        PrebidAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
