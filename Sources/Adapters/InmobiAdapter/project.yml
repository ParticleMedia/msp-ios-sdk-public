# InmobiAdapter XcodeGen Project Specification
# Uses shared template and adds InmobiAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: InmobiAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: InmobiAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.InmobiAdapter
    PRODUCT_MODULE_NAME: InmobiAdapter

targets:
  InmobiAdapter:
    type: framework
    platform: iOS
    sources:
      - path: InmobiAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "InmobiAdapter.docc/**"
    dependencies:
      - framework: ../../../Build/XCFrameworks/MSPiOSCore.xcframework
        embed: false
      - framework: ../../Core/MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: ../../../Sources/Wrappers/InMobiSDKWrapper/Frameworks/InMobiSDK.xcframework
        embed: false
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        
        # Framework Search Paths - XCFrameworks only
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../../Build/XCFrameworks
          - $(SRCROOT)/../../Core/MSPSharedLibraries
          - $(SRCROOT)/../../../Sources/Core/ThirdParty/Kingfisher
          - $(SRCROOT)/../../../Sources/Core/ThirdParty/SnapKit
          - $(SRCROOT)/../../../Sources/Core/ThirdParty/Lottie
          - $(SRCROOT)/../../../Sources/Core/ThirdParty/Shimmer
          - $(SRCROOT)/../../../Sources/Core/ThirdParty/SwiftProtobuf
          - $(SRCROOT)/../../../Sources/Core/MSPOMSDK/OMSDK_Newsbreak1.xcframework
          - $(SRCROOT)/../../../Sources/Wrappers/InMobiSDKWrapper/Frameworks

schemes:
  InmobiAdapter:
    build:
      targets:
        InmobiAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
