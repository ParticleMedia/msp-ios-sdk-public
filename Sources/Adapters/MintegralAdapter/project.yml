# MintegralAdapter XcodeGen Project Specification
# Uses shared template and adds MintegralAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: MintegralAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MintegralAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.MintegralAdapter
    PRODUCT_MODULE_NAME: MintegralAdapter

targets:
  MintegralAdapter:
    type: framework
    platform: iOS
    sources:
      - path: MintegralAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "MintegralAdapter.docc/**"
    dependencies:
      - framework: ../../../../../../../../Build/XCFrameworks/MSPiOSCore.xcframework
        embed: false
      - framework: ../../../../../../../../Build/XCFrameworks/PrebidMobile.xcframework
        embed: false
      - framework: ../../../../../Pods/MintegralAdSDK/Fmk/MTGSDK.xcframework
        embed: false
      - framework: ../../../../../Pods/MintegralAdSDK/Fmk/MTGSDKBanner.xcframework
        embed: false
      - framework: ../../../../../Pods/MintegralAdSDK/Fmk/MTGSDKNewInterstitial.xcframework
        embed: false
      - framework: ../../../../../Pods/MintegralAdSDK/Fmk/MTGSDKInterstitialVideo.xcframework
        embed: false
      - framework: ../../../../../Pods/MintegralAdSDK/Fmk/MTGSDKBidding.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Framework Search Paths - Include MSPiOSCore and PrebidMobile XCFrameworks
        # MintegralAdapter depends on MSPiOSCore and PrebidMobile, which are located in MSPSharedLibraries
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../../../../../../../Build/XCFrameworks/MSPiOSCore.xcframework
          - $(SRCROOT)/../../../../../../../../Build/XCFrameworks/PrebidMobile.xcframework
          - $(SRCROOT)/../../../../../Pods/MintegralAdSDK/Fmk/MTGSDK.xcframework
          - $(SRCROOT)/../../../../../Pods/MintegralAdSDK/Fmk/MTGSDKBanner.xcframework
          - $(SRCROOT)/../../../../../Pods/MintegralAdSDK/Fmk/MTGSDKNewInterstitial.xcframework
          - $(SRCROOT)/../../../../../Pods/MintegralAdSDK/Fmk/MTGSDKInterstitialVideo.xcframework
          - $(SRCROOT)/../../../../../Pods/MintegralAdSDK/Fmk/MTGSDKBidding.xcframework

schemes:
  MintegralAdapter:
    build:
      targets:
        MintegralAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
