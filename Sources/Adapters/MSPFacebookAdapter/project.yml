# MSPFacebookAdapter XcodeGen Project Specification
# Uses shared template and adds MSPFacebookAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../../../Configs/xcodegen/module.project_template.yml

name: MSPFacebookAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MSPFacebookAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.MSPFacebookAdapter
    PRODUCT_MODULE_NAME: MSPFacebookAdapter

targets:
  MSPFacebookAdapter:
    type: framework
    platform: iOS
    sources:
      - path: MSPFacebookAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "FacebookAdapter.docc/**"
    dependencies:
      - framework: ../../../Build/XCFrameworks/MSPiOSCore.xcframework
        embed: false
      - framework: ../../Core/MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: ../../../Pods/FBAudienceNetwork/Static/FBAudienceNetwork.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../../../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/../../..
        
        # Framework Search Paths - Include MSPiOSCore and PrebidMobile XCFrameworks
        # MSPFacebookAdapter depends on MSPiOSCore and PrebidMobile, which are located in MSPSharedLibraries
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../../Build/XCFrameworks/MSPiOSCore.xcframework
          - $(SRCROOT)/../../Core/MSPSharedLibraries/PrebidMobile.xcframework
          - $(SRCROOT)/../../../Pods/FBAudienceNetwork/Static/FBAudienceNetwork.xcframework
        
        # Link zlib library (required by FBAudienceNetwork)
        # FBAudienceNetwork uses zlib functions (deflateInit2_, inflateEnd, etc.) that require linking against zlib
        OTHER_LDFLAGS: $(inherited) -lz
    configFiles:
      Debug: "../../../Pods/Target Support Files/Pods-MSPFacebookAdapter/Pods-MSPFacebookAdapter.debug.xcconfig"
      Release: "../../../Pods/Target Support Files/Pods-MSPFacebookAdapter/Pods-MSPFacebookAdapter.release.xcconfig"

schemes:
  MSPFacebookAdapter:
    build:
      targets:
        MSPFacebookAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
