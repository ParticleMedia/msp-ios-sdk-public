# InmobiAdapter XcodeGen Project Specification
# Uses shared template and adds InmobiAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: InmobiAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: InmobiAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.InmobiAdapter
    PRODUCT_MODULE_NAME: InmobiAdapter

targets:
  InmobiAdapter:
    type: framework
    platform: iOS
    sources:
      - path: InmobiAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "InmobiAdapter.docc/**"
    dependencies:
      - framework: ../MSPSharedLibraries/MSPiOSCore.xcframework
        embed: false
      - framework: ../MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: ../Pods/InMobiSDK/InMobiSDK.xcframework
        embed: false
    settings:
      base:
        # Framework Search Paths - Include MSPiOSCore, PrebidMobile, and InMobiSDK XCFrameworks
        # InmobiAdapter depends on MSPiOSCore and PrebidMobile (in MSPSharedLibraries) and InMobiSDK (Pod-provided XCFramework)
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../MSPSharedLibraries/MSPiOSCore.xcframework
          - $(SRCROOT)/../MSPSharedLibraries/PrebidMobile.xcframework
          - $(PODS_ROOT)/InMobiSDK/InMobiSDK.xcframework

schemes:
  InmobiAdapter:
    build:
      targets:
        InmobiAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
