# MSPFacebookAdapter XcodeGen Project Specification
# Uses shared template and adds MSPFacebookAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: MSPFacebookAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MSPFacebookAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.MSPFacebookAdapter
    PRODUCT_MODULE_NAME: MSPFacebookAdapter

targets:
  MSPFacebookAdapter:
    type: framework
    platform: iOS
    sources:
      - path: MSPFacebookAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "FacebookAdapter.docc/**"
    dependencies:
      - framework: ../MSPSharedLibraries/MSPiOSCore.xcframework
        embed: false
      - framework: ../MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: ../Pods/FBAudienceNetwork/Static/FBAudienceNetwork.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Framework Search Paths - Include MSPiOSCore and PrebidMobile XCFrameworks
        # MSPFacebookAdapter depends on MSPiOSCore and PrebidMobile, which are located in MSPSharedLibraries
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../MSPSharedLibraries/MSPiOSCore.xcframework
          - $(SRCROOT)/../MSPSharedLibraries/PrebidMobile.xcframework
          - $(PODS_ROOT)/FBAudienceNetwork/Static/FBAudienceNetwork.xcframework
        
        # Link zlib library (required by FBAudienceNetwork)
        # FBAudienceNetwork uses zlib functions (deflateInit2_, inflateEnd, etc.) that require linking against zlib
        OTHER_LDFLAGS: $(inherited) -lz
    configFiles:
      Debug: "../Pods/Target Support Files/Pods-MSPFacebookAdapter/Pods-MSPFacebookAdapter.debug.xcconfig"
      Release: "../Pods/Target Support Files/Pods-MSPFacebookAdapter/Pods-MSPFacebookAdapter.release.xcconfig"
    prebuildScripts:
      - name: "[CP] Check Pods Manifest.lock"
        script: |
          if [ -z "${PODS_PODFILE_DIR_PATH}" ] || [ -z "${PODS_ROOT}" ]; then
            echo "error: CocoaPods environment variables are not set." >&2
            exit 1
          fi
          if [ ! -e "${PODS_ROOT}/Manifest.lock" ] || [ ! -e "${PODS_PODFILE_DIR_PATH}/Podfile.lock" ]; then
            echo "error: Run 'pod install' to generate Pods/Manifest.lock." >&2
            exit 1
          fi
          if ! diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" >/dev/null; then
            echo "error: The sandbox is not in sync with the Podfile.lock. Run 'pod install' or update your CocoaPods installation." >&2
            exit 1
          fi
        shell: /bin/sh
        inputFiles:
          - ${PODS_PODFILE_DIR_PATH}/Podfile.lock
          - ${PODS_ROOT}/Manifest.lock
    postbuildScripts:
      - name: "[CP] Copy Pods Resources"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-MSPFacebookAdapter/Pods-MSPFacebookAdapter-resources.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-MSPFacebookAdapter/Pods-MSPFacebookAdapter-resources.sh"
          fi
        shell: /bin/sh
      - name: "[CP] Embed Pods Frameworks"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-MSPFacebookAdapter/Pods-MSPFacebookAdapter-frameworks.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-MSPFacebookAdapter/Pods-MSPFacebookAdapter-frameworks.sh"
          fi
        shell: /bin/sh

schemes:
  MSPFacebookAdapter:
    build:
      targets:
        MSPFacebookAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
