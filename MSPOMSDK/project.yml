# MSPOMSDK XcodeGen Project Specification
# This file uses the shared module template and adds MSPOMSDK-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: MSPOMSDK

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MSPOMSDK
    PRODUCT_BUNDLE_IDENTIFIER: msp.MSPOMSDK
    PRODUCT_MODULE_NAME: MSPOMSDK
    
    # Framework Search Paths - Include OMSDK_Newsbreak1.xcframework
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/OMSDK_Newsbreak1.xcframework

targets:
  MSPOMSDK:
    type: framework
    platform: iOS
    sources:
      - path: MSPOMSDK
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "MSPOMSDK.docc/**"
    settings:
      base:
        # Header Search Paths - inherit from CocoaPods xcconfig
        HEADER_SEARCH_PATHS: $(inherited)
        
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        # xcconfig defines these relative to MSPOMSDK/, but we need repo root
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Module Interface Verification
        # Disable for MSPOMSDK to avoid "underlying Objective-C module not found" errors
        # This is safe because MSPOMSDK is a mixed Swift/ObjC module and the ObjC module is available at runtime
        OTHER_SWIFT_FLAGS: $(inherited) -no-verify-emitted-module-interface
        
        # Framework Search Paths - Include OMSDK_Newsbreak1.xcframework
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/OMSDK_Newsbreak1.xcframework
    configFiles:
      Debug: "../Pods/Target Support Files/Pods-MSPOMSDK/Pods-MSPOMSDK.debug.xcconfig"
      Release: "../Pods/Target Support Files/Pods-MSPOMSDK/Pods-MSPOMSDK.release.xcconfig"
    prebuildScripts:
      - name: "[CP] Check Pods Manifest.lock"
        script: |
          if [ -z "${PODS_PODFILE_DIR_PATH}" ] || [ -z "${PODS_ROOT}" ]; then
            echo "error: CocoaPods environment variables are not set." >&2
            exit 1
          fi
          if [ ! -e "${PODS_ROOT}/Manifest.lock" ] || [ ! -e "${PODS_PODFILE_DIR_PATH}/Podfile.lock" ]; then
            echo "error: Run 'pod install' to generate Pods/Manifest.lock." >&2
            exit 1
          fi
          if ! diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" >/dev/null; then
            echo "error: The sandbox is not in sync with the Podfile.lock. Run 'pod install' or update your CocoaPods installation." >&2
            exit 1
          fi
        shell: /bin/sh
        inputFiles:
          - ${PODS_PODFILE_DIR_PATH}/Podfile.lock
          - ${PODS_ROOT}/Manifest.lock
    postbuildScripts:
      - name: "[CP] Copy Pods Resources"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-MSPOMSDK/Pods-MSPOMSDK-resources.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-MSPOMSDK/Pods-MSPOMSDK-resources.sh"
          fi
        shell: /bin/sh
      - name: "[CP] Embed Pods Frameworks"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-MSPOMSDK/Pods-MSPOMSDK-frameworks.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-MSPOMSDK/Pods-MSPOMSDK-frameworks.sh"
          fi
        shell: /bin/sh

schemes:
  MSPOMSDK:
    build:
      targets:
        MSPOMSDK: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
