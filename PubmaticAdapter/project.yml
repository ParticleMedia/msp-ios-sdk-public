# PubmaticAdapter XcodeGen Project Specification
# Uses shared template and adds PubmaticAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: PubmaticAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: PubmaticAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.PubmaticAdapter
    PRODUCT_MODULE_NAME: PubmaticAdapter

targets:
  PubmaticAdapter:
    type: framework
    platform: iOS
    sources:
      - path: PubmaticAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "PubmaticAdapter.docc/**"
    dependencies:
      - framework: ../MSPSharedLibraries/MSPiOSCore.xcframework
        embed: false
      - framework: ../MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: ../Pods/OpenWrapSDK/OpenWrapSDK/OpenWrapSDK.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Framework Search Paths - Include MSPiOSCore and PrebidMobile XCFrameworks
        # PubmaticAdapter depends on MSPiOSCore and PrebidMobile, which are located in MSPSharedLibraries
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../MSPSharedLibraries/MSPiOSCore.xcframework
          - $(SRCROOT)/../MSPSharedLibraries/PrebidMobile.xcframework
          - $(PODS_ROOT)/OpenWrapSDK/OpenWrapSDK/OpenWrapSDK.xcframework

schemes:
  PubmaticAdapter:
    build:
      targets:
        PubmaticAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
