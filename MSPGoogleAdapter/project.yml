# MSPGoogleAdapter XcodeGen Project Specification
# Uses shared template and adds MSPGoogleAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: MSPGoogleAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MSPGoogleAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.MSPGoogleAdapter
    PRODUCT_MODULE_NAME: MSPGoogleAdapter

targets:
  MSPGoogleAdapter:
    type: framework
    platform: iOS
    sources:
      - path: MSPGoogleAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "GoogleAdapter.docc/**"
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Framework Search Paths - Include $(PROJECT_DIR) to find local XCFrameworks
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)
    configFiles:
      Debug: "../Pods/Target Support Files/Pods-MSPGoogleAdapter/Pods-MSPGoogleAdapter.debug.xcconfig"
      Release: "../Pods/Target Support Files/Pods-MSPGoogleAdapter/Pods-MSPGoogleAdapter.release.xcconfig"
    prebuildScripts:
      - name: "[CP] Check Pods Manifest.lock"
        script: |
          if [ -z "${PODS_PODFILE_DIR_PATH}" ] || [ -z "${PODS_ROOT}" ]; then
            echo "error: CocoaPods environment variables are not set." >&2
            exit 1
          fi
          if [ ! -e "${PODS_ROOT}/Manifest.lock" ] || [ ! -e "${PODS_PODFILE_DIR_PATH}/Podfile.lock" ]; then
            echo "error: Run 'pod install' to generate Pods/Manifest.lock." >&2
            exit 1
          fi
          if ! diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" >/dev/null; then
            echo "error: The sandbox is not in sync with the Podfile.lock. Run 'pod install' or update your CocoaPods installation." >&2
            exit 1
          fi
        shell: /bin/sh
        inputFiles:
          - ${PODS_PODFILE_DIR_PATH}/Podfile.lock
          - ${PODS_ROOT}/Manifest.lock
    postbuildScripts:
      - name: "[CP] Copy Pods Resources"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-MSPGoogleAdapter/Pods-MSPGoogleAdapter-resources.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-MSPGoogleAdapter/Pods-MSPGoogleAdapter-resources.sh"
          fi
        shell: /bin/sh
      - name: "[CP] Embed Pods Frameworks"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-MSPGoogleAdapter/Pods-MSPGoogleAdapter-frameworks.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-MSPGoogleAdapter/Pods-MSPGoogleAdapter-frameworks.sh"
          fi
        shell: /bin/sh

schemes:
  MSPGoogleAdapter:
    build:
      targets:
        MSPGoogleAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
