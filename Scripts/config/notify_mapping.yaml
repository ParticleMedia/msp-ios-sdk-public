slack:
  dm_template: |
    🎉 MSP Release {{VERSION}}
    Author: {{AUTHOR}}
    Duration: {{DURATION}}
    
    Modules:
    {{MODULES}}
    
    Verification:
    {{VERIFICATION}}
    
    {{FAILURE_CONTEXT}}
  
  channel_template: |
    🎉 MSP Release {{VERSION}} | {{AUTHOR}} | {{DURATION}}
    Modules: {{MODULES_SHORT}}
    Verification: {{VERIFICATION_SHORT}}
    {{FAILURE_CONTEXT_SHORT}}

email:
  from: "msp-no-reply@newsbreak.com"
  subject_template: "MSP Release {{VERSION}} — {{STATUS}}"
  html_template: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.6; margin: 20px; }
        .header { background: #4CAF50; color: white; padding: 20px; border-radius: 5px; }
        .section { margin: 20px 0; padding: 15px; border-left: 4px solid #2196F3; background: #f5f5f5; }
        .module { padding: 5px 0; }
        .verification-item { padding: 3px 0; }
        .failure { background: #ffebee; border-left-color: #f44336; }
        .success { color: #4CAF50; font-weight: bold; }
        .warning { color: #ff9800; font-weight: bold; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #999; }
      </style>
    </head>
    <body>
      <div class="header">
        <h1>MSP Release Summary — {{VERSION}}</h1>
        <p>Author: {{AUTHOR}} | Duration: {{DURATION}} | Time: {{TIMESTAMP}}</p>
      </div>
      
      <div class="section">
        <h2>Modules Released</h2>
        {{MODULES_HTML}}
      </div>
      
      <div class="section">
        <h2>Verification Results</h2>
        {{VERIFICATION_HTML}}
      </div>
      
      {{FAILURE_CONTEXT_HTML}}
      
      <div class="footer">
        Generated by MSP Release Pipeline
      </div>
    </body>
    </html>

