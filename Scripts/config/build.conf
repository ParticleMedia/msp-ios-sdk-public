# MSP iOS SDK Build Configuration
# This file contains default build settings and configurations
#
# OUTPUT DIRECTORY STRUCTURE:
# OUTPUT_BASE_DIR/                    # Base directory for all build outputs
# ├── Build/Temp/MSPiOSCore/        # MSPiOSCore framework build artifacts
# │   └── xcframework/               # Final XCFramework output
# ├── Build/Temp/NovaCore/           # NovaCore framework build artifacts  
# │   └── xcframework/               # Final XCFramework output
# └── DerivedData/                   # Xcode build cache (optional)

# Build system metadata
BUILD_SYSTEM_VERSION="2.0.0"
BUILD_SYSTEM_NAME="MSP iOS SDK Build System"

# Default build settings
DEFAULT_CONFIGURATION="Release"
DEFAULT_IOS_DEPLOYMENT_TARGET="15.0"
DEFAULT_SKIP_CODE_SIGN="0"

# Xcode settings
XCODE_WORKSPACE="msp-ios-sdk.xcworkspace"
XCODE_DERIVED_DATA_PATH="DerivedData"

# Build optimization settings
BUILD_LIBRARY_FOR_DISTRIBUTION="YES"
SKIP_INSTALL="NO"
ONLY_ACTIVE_ARCH="NO"
COMPILER_INDEX_STORE_ENABLE="NO"
SWIFT_COMPILATION_MODE="wholemodule"

# Architecture configurations
IOS_DEVICE_ARCHS="arm64"
IOS_SIMULATOR_ARCHS="arm64 x86_64"

# SDK mappings
IOS_DEVICE_SDK="iphoneos"
IOS_SIMULATOR_SDK="iphonesimulator"

# Code signing settings (when enabled)
CODE_SIGN_STYLE="Automatic"
DEVELOPMENT_TEAM=""  # Set via environment variable or command line

# Build output directories
# OUTPUT_BASE_DIR: Base directory for all build outputs (can be overridden)
OUTPUT_BASE_DIR="output"
# Framework-specific output directories (relative to OUTPUT_BASE_DIR)
MSPIOSSCORE_OUTPUT_DIR="Build/Temp/MSPiOSCore"
NOVA_OUTPUT_DIR="Build/Temp/NovaCore"

# Deployment directories
MSPIOSSCORE_DEPLOY_DIR="MSPSharedLibraries"
NOVA_DEPLOY_DIR="NovaAdapter"

# Logging and debugging
DEFAULT_LOG_LEVEL="INFO"
BUILD_VERBOSE="NO"
ENABLE_BUILD_TIMING="YES"

# CI/CD settings
CI_CACHE_ENABLED="YES"
CI_ARTIFACT_RETENTION_DAYS="30"
CI_PARALLEL_BUILDS="YES"

# Performance settings
MAX_PARALLEL_JOBS="4"
BUILD_TIMEOUT_MINUTES="30"
ARCHIVE_TIMEOUT_MINUTES="20"

# Validation settings
VALIDATE_BEFORE_BUILD="YES"
VALIDATE_AFTER_BUILD="YES"
STRICT_VALIDATION="NO"

# Cleanup settings
AUTO_CLEANUP_BUILD_ARTIFACTS="YES"
CLEANUP_DERIVED_DATA="NO"
CLEANUP_ARCHIVES_AFTER_FRAMEWORK="YES"

# Environment-specific overrides
# These can be overridden by environment variables or plugins
#
# OUTPUT_BASE_DIR can be overridden via:
# - Environment variable: export OUTPUT_BASE_DIR="/custom/path"
# - Command line: OUTPUT_BASE_DIR="/custom/path" ./Scripts/build.sh
# - CI/CD: Set in GitHub Actions workflow

# Local development
LOCAL_SKIP_CODE_SIGN="1"
LOCAL_VERBOSE="YES"
LOCAL_CLEANUP="NO"

# CI environments
CI_SKIP_CODE_SIGN="1"
CI_VERBOSE="YES"
CI_CLEANUP="YES"
CI_STRUCTURED_OUTPUT="YES"

# Production
PRODUCTION_SKIP_CODE_SIGN="0"
PRODUCTION_VERBOSE="NO"
PRODUCTION_CLEANUP="YES"
PRODUCTION_STRICT_VALIDATION="YES"
