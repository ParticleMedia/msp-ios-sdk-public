# Adapter SDK version update configuration
# Used by release scripts to update getSDKVersion() values.

# Tool to update SDK version (relative to repo root or absolute)
ADAPTER_SDK_VERSION_TOOL="Scripts/tools/update_adapter_sdk_version.py"

# Swift function name to update
ADAPTER_SDK_VERSION_FUNCTION="getSDKVersion"

# Adapters that should NOT be updated (space-separated)
ADAPTER_SDK_VERSION_SKIP_ADAPTERS="MSPGoogleAdapter MSPFacebookAdapter"

# Strict mode: fail if function or string literal is missing (true/false)
ADAPTER_SDK_VERSION_STRICT="false"
