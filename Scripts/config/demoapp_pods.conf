# DemoApp Pods xcconfig mapping (config-driven)
# Paths are relative to the generated project.yml location.

# Examples/MSPDemoApp/project.yml (generate_workspace.sh)
DEMOAPP_PODS_XCCONFIG_DEBUG_REL_EXAMPLES="../../Pods/Target Support Files/Pods-MSPDemoApp/Pods-MSPDemoApp.debug.xcconfig"
DEMOAPP_PODS_XCCONFIG_RELEASE_REL_EXAMPLES="../../Pods/Target Support Files/Pods-MSPDemoApp/Pods-MSPDemoApp.release.xcconfig"

# MSPDemoApp/project.yml (workspace/update.sh)
DEMOAPP_PODS_XCCONFIG_DEBUG_REL_ROOT="../Pods/Target Support Files/Pods-MSPDemoApp/Pods-MSPDemoApp.debug.xcconfig"
DEMOAPP_PODS_XCCONFIG_RELEASE_REL_ROOT="../Pods/Target Support Files/Pods-MSPDemoApp/Pods-MSPDemoApp.release.xcconfig"

# Targets that should receive Pods xcconfig
DEMOAPP_PODS_TARGETS=("MSPDemoApp" "MSPDemoAppTests" "MSPDemoAppUITests")
