# MSP iOS SDK Environment Configurations
# This file defines environment-specific settings and overrides

# Environment detection patterns
# Used by the build system to automatically detect and configure environments

# Local Development Environment
LOCAL_ENV_PATTERNS="
TTY_AVAILABLE=true;
CI=;
GITHUB_ACTIONS=;
GITLAB_CI=;
CIRCLECI=;
TRAVIS=;
JENKINS_URL=
"

LOCAL_ENV_CONFIG="
name=local;
description=Local Development Environment;
skip_code_sign=1;
verbose=true;
cleanup=false;
structured_output=false;
enable_colors=true;
enable_emoji=true;
log_level=DEBUG;
cache_enabled=true;
parallel_builds=false;
validation_level=standard;
artifact_retention=7;
performance_monitoring=false
"

