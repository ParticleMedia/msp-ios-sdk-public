# Production Environment
PRODUCTION_ENV_PATTERNS="
PRODUCTION_BUILD=true;
RELEASE_BUILD=true
"

PRODUCTION_ENV_CONFIG="
name=production;
description=Production Build Environment;
skip_code_sign=0;
verbose=false;
cleanup=true;
structured_output=false;
enable_colors=true;
enable_emoji=true;
log_level=WARN;
cache_enabled=false;
parallel_builds=true;
validation_level=strict;
artifact_retention=90;
performance_monitoring=true;
code_signing_required=true;
distribution_build=true
"

# Environment-specific tool configurations

# Xcode settings by environment
LOCAL_XCODE_CONFIG="
derived_data_path=DerivedData;
build_settings_override=;
schemes_to_build=all;
clean_before_build=false;
archive_include_symbols=true
"

CI_XCODE_CONFIG="
derived_data_path=/tmp/DerivedData;
build_settings_override=COMPILER_INDEX_STORE_ENABLE=NO;
schemes_to_build=required;
clean_before_build=true;
archive_include_symbols=false
"

PRODUCTION_XCODE_CONFIG="
derived_data_path=DerivedData;
build_settings_override=;
schemes_to_build=release;
clean_before_build=true;
archive_include_symbols=true;
code_sign_on_copy=true
"

# CocoaPods settings by environment
LOCAL_COCOAPODS_CONFIG="
repo_update=false;
verbose=false;
deployment_target_override=;
use_bundle_exec=true;
cache_enabled=true
"

CI_COCOAPODS_CONFIG="
repo_update=true;
verbose=true;
deployment_target_override=;
use_bundle_exec=true;
cache_enabled=true;
parallel_downloads=true
"

PRODUCTION_COCOAPODS_CONFIG="
repo_update=true;
verbose=false;
deployment_target_override=;
use_bundle_exec=true;
cache_enabled=false;
clean_install=true
"

# Plugin configurations by environment
LOCAL_PLUGINS="logging validation xcode cocoapods"
CI_PLUGINS="logging validation xcode cocoapods ci"
FASTLANE_PLUGINS="logging validation xcode cocoapods fastlane"
PRODUCTION_PLUGINS="logging validation xcode cocoapods ci"

# Environment hierarchy (for inheritance)
# Lower environments inherit from higher ones unless overridden
ENVIRONMENT_HIERARCHY="
production > generic-ci > local;
github-actions > generic-ci;
gitlab-ci > generic-ci;
circleci > generic-ci;
travis-ci > generic-ci;
jenkins > generic-ci;
fastlane > local
"

# Default environment (when auto-detection fails)
DEFAULT_ENVIRONMENT="local"

# Environment validation rules
ENV_VALIDATION_RULES="
local: xcode_available,cocoapods_available;
github-actions: xcode_available,cocoapods_available,ci_tools_available;
gitlab-ci: xcode_available,cocoapods_available,ci_tools_available;
circleci: xcode_available,cocoapods_available,ci_tools_available;
travis-ci: xcode_available,cocoapods_available,ci_tools_available;
jenkins: xcode_available,cocoapods_available,ci_tools_available;
fastlane: xcode_available,cocoapods_available,fastlane_available;
production: xcode_available,cocoapods_available,code_signing_available
"
