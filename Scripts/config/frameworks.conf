# MSP iOS SDK Framework Configurations
# This file defines all frameworks, their dependencies, and build settings
#
# IMPORTANT: Framework Types and Podspec Usage
# - XCFrameworks (binary distributions): NO podspec needed
# - Source-only frameworks: podspec required for CocoaPods integration
# - Adapter frameworks: typically source-only with podspecs
#
# Framework definitions
# Format: FRAMEWORK_NAME_CONFIG="setting1=value1;setting2=value2;..."

# MSPiOSCore Framework
MSPIOSSCORE_CONFIG="
name=MSPiOSCore;
scheme=MSPiOSCore;
output_dir=outputMSPiOSCore;
deploy_dir=MSPSharedLibraries;
xcframework_name=MSPiOSCore.xcframework;
platforms=ios,ios-simulator;
dependencies=;
build_order=1;
required=true;
test_scheme=MSPiOSCore;
# No podspec for XCFrameworks - they are binary distributions
"

# NovaCore Framework
NOVACORE_CONFIG="
name=NovaCore;
scheme=NovaCore;
output_dir=outputNova;
deploy_dir=NovaAdapter;
xcframework_name=NovaCore.xcframework;
platforms=ios,ios-simulator;
dependencies=MSPiOSCore;
build_order=2;
required=true;
test_scheme=NovaCore;
# No podspec for XCFrameworks - they are binary distributions
cocoapods_required=true
"

# MSPCore Framework
MSPCORE_CONFIG="
name=MSPCore;
