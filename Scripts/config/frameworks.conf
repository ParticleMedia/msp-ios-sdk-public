# Framework Groups
# Define groups of frameworks for batch operations

# Core frameworks (required for basic functionality)
CORE_FRAMEWORKS="MSPiOSCore NovaCore"

# Binary frameworks (produce XCFrameworks)
BINARY_FRAMEWORKS="MSPiOSCore NovaCore"

# Source frameworks (source-only distribution)
SOURCE_FRAMEWORKS="MSPCore MSPGoogleAdapter MSPFacebookAdapter NovaAdapter PrebidAdapter UnityAdapter InmobiAdapter MintegralAdapter MobilefuseAdapter PubmaticAdapter MSPSharedLibraries"

# Adapter frameworks
ADAPTER_FRAMEWORKS="MSPGoogleAdapter MSPFacebookAdapter NovaAdapter PrebidAdapter UnityAdapter InmobiAdapter MintegralAdapter MobilefuseAdapter PubmaticAdapter"

# Test targets
TEST_FRAMEWORKS="MSPiOSCore NovaCore MSPCore MSPGoogleAdapter MSPFacebookAdapter NovaAdapter PrebidAdapter UnityAdapter InmobiAdapter MintegralAdapter MobilefuseAdapter PubmaticAdapter MSPSharedLibraries MSPDemoApp"

# All frameworks
ALL_FRAMEWORKS="MSPiOSCore NovaCore MSPCore MSPGoogleAdapter MSPFacebookAdapter NovaAdapter PrebidAdapter UnityAdapter InmobiAdapter MintegralAdapter MobilefuseAdapter PubmaticAdapter MSPSharedLibraries MSPDemoApp"

# Build configurations for different scenarios

# Minimal build (core only)
MINIMAL_BUILD_FRAMEWORKS="MSPiOSCore NovaCore"

# Standard build (core + main adapters)
STANDARD_BUILD_FRAMEWORKS="MSPiOSCore NovaCore MSPCore MSPGoogleAdapter MSPFacebookAdapter NovaAdapter"

# Full build (everything)
FULL_BUILD_FRAMEWORKS="$ALL_FRAMEWORKS"

# Release build (frameworks suitable for release)
RELEASE_BUILD_FRAMEWORKS="MSPiOSCore NovaCore MSPCore MSPGoogleAdapter MSPFacebookAdapter NovaAdapter PrebidAdapter UnityAdapter InmobiAdapter MintegralAdapter MobilefuseAdapter PubmaticAdapter MSPSharedLibraries"
