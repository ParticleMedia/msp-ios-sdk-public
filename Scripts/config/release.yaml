# ============================================================================
# MSP iOS SDK - Release Configuration (Consolidated)
# ============================================================================
# Version: 2.0
#
# This file combines profile-based configuration with module definitions.
# It is the Single Source of Truth (SSOT) for release configuration.
#
# Usage:
#   ./Scripts/msp-release.sh run 1.0.0
#   ./Scripts/msp-release.sh run --full 1.0.0
#   ./Scripts/msp-release.sh run --profile=production 1.0.0
# ============================================================================

# Schema version for migration support
schema_version: 2

# ============================================================================
# RELEASE METADATA
# ============================================================================

# Release version (set via CLI or here for CI)
version: ""

# Branch configuration
release_branch: ""          # Auto-generated as "release/{version}" if empty
base_branch: ""                 # Empty = auto-detect current branch at runtime

# ============================================================================
# PROFILE SYSTEM
# ============================================================================

# Default profile when no --profile specified
default_profile: local-dev

# Profile definitions
# NOTE: mode (simple/full) is set by --full flag OR automatically by --profile=production
# NOTE: CI and Local have NO difference - same logging format, same Slack channel
profiles:
  # ---------------------------------------------------------------------------
  # local-dev: Local development and testing (DEFAULT)
  # ---------------------------------------------------------------------------
  local-dev:
    dry_run: true             # Preview without publishing

    validation:
      preflight: basic        # basic or full

    notifications:
      slack:
        enabled: true
        env: prod             # Same as production
      email:
        enabled: false

    logging:
      level: info             # debug, info, warn, error
      format: pretty          # pretty (same for CI and local)

    safety:
      allow_existing_tag: true
      allow_existing_release: true
      keep_sandbox: true

    performance:
      parallel_builds: true
      max_workers: 4
      cdn_wait_time: 10

  # ---------------------------------------------------------------------------
  # quick-test: Minimal validation for quick testing
  # ---------------------------------------------------------------------------
  quick-test:
    dry_run: true

    validation:
      preflight: none         # Skip all validation

    notifications:
      slack:
        enabled: false
      email:
        enabled: false

    logging:
      level: warn
      format: pretty

    safety:
      allow_existing_tag: true
      allow_existing_release: true
      keep_sandbox: true

    performance:
      parallel_builds: true
      max_workers: 8
      cdn_wait_time: 5

  # ---------------------------------------------------------------------------
  # production: Real publishing (used by both CI and Local)
  # ---------------------------------------------------------------------------
  production:
    dry_run: false            # Real publishing

    validation:
      preflight: full

    notifications:
      slack:
        enabled: true
        env: prod
      email:
        enabled: true
        recipients:
          - msp-team@newsbreak.com

    logging:
      level: info
      format: pretty          # Same as local (not JSON)

    safety:
      allow_existing_tag: false
      allow_existing_release: false
      keep_sandbox: false
      require_ci: false       # CI is the default path; local production is gated by safety.sh emergency override checks

    performance:
      parallel_builds: true
      max_workers: 6
      cdn_wait_time: 120

# ============================================================================
# MODULE CONFIGURATION
# ============================================================================

# CocoaPods modules (in dependency order)
# NOTE: ALL modules use binary distribution (HTTP zip + vendored_frameworks)
pods:
  enabled: true

  # Release order (dependencies first)
  # Total: 12 modules, all binary distribution
  modules:
    # Core modules (foundation first)
    - MSPiOSCore
    - MSPSharedLibraries
    # Common modules
    - MSPGoogleAdsTypes
    # Adapters
    - MSPPrebidAdapter
    - MSPGoogleAdapter
    - MSPFacebookAdapter
    - MSPNovaAdapter
    - MSPAmazonAdapter
    - MSPMolocoAdapter
    - MSPLiftoffAdapter
    - MSPApplovinMaxAdapter
    # MSPCore depends on MSPPrebidAdapter, so comes last
    - MSPCore

  # Remote verification
  remote_url: "https://github.com/ParticleMedia/msp-ios-sdk-public"
  remote_primary_product: "MSPCore"

# SPM packages
# NOTE: SPM packages should match CocoaPods modules (all binary)
spm:
  enabled: true

  packages:
    - MSPiOSCore
    - MSPSharedLibraries
    - MSPGoogleAdsTypes
    - MSPPrebidAdapter
    - MSPGoogleAdapter
    - MSPFacebookAdapter
    - MSPNovaAdapter
    - MSPAmazonAdapter
    - MSPMolocoAdapter
    - MSPLiftoffAdapter
    - MSPApplovinMaxAdapter
    - MSPCore

  # Remote verification
  remote_url: "https://github.com/ParticleMedia/msp-ios-sdk-public"
  remote_product_name: "MSPAds"

# ============================================================================
# VERIFICATION CONFIGURATION
# ============================================================================

verify:
  # Sandbox directory for isolated verification
  sandbox_dir: "/tmp/msp-verify-sandbox"
  cleanup_on_success: true

  # Verification types (enabled in full mode)
  types:
    local: true               # Local simulator build
    remote_pods: true         # CocoaPods trunk verification
    remote_spm: true          # SPM package resolution
    sample_app: true          # Demo app build
    device: false             # Physical device test (optional)

  # Strictness
  spm_strict: true            # Fail on SPM verification failure

  # Timeouts (seconds)
  timeouts:
    local: 300
    remote_pods: 600
    remote_spm: 300
    sample_app: 600
    device: 900

# ============================================================================
# ENVIRONMENT VARIABLE MAPPING (for backward compatibility)
# ============================================================================
#
# These environment variables can override config values:
#
# | Environment Variable      | Config Path                               |
# |---------------------------|-------------------------------------------|
# | DRY_RUN                   | profiles.{profile}.dry_run                |
# | MSP_LOG_LEVEL             | profiles.{profile}.logging.level          |
# | MSP_ALLOW_EXISTING_TAG    | profiles.{profile}.safety.allow_existing_tag |
# | MSP_PARALLEL_BUILDS       | profiles.{profile}.performance.parallel_builds |
# | MSP_CDN_WAIT_TIME         | profiles.{profile}.performance.cdn_wait_time |
# | MSP_SANDBOX_DIR           | verify.sandbox_dir                        |
#
# REMOVED Variables (no longer supported - will cause errors if set):
# | MSP_DRY_RUN               | Use DRY_RUN instead                       |
# | MSP_RELEASE_TIER          | Use DRY_RUN=true/false instead            |
# | MSP_ALLOW_LOCAL_RELEASE   | Use --profile=local-dev instead           |
# | MSP_ALLOW_TRUNK_PUSH      | Use DRY_RUN=false instead                 |
# ============================================================================

# ============================================================================
# TIER-SPECIFIC OVERRIDES
# ============================================================================
# These sections define per-tier configuration overrides.
# Used by is_enabled() and msp_cfg_get() to determine behavior per tier.
# Tiers: preflight (dry-run), test, release (production)

tier:
  default: preflight    # preflight | production

preflight:
  pods:
    enabled: false
  spm:
    enabled: false
  branch:
    create: false
    push: false
  verify:
    local: true
    remote: false
    xcframework: true

test:
  pods:
    enabled: true
  spm:
    enabled: true
  branch:
    create: true
    push: true
  verify:
    local: true
    remote: true
    device: true
    xcframework: true

release:
  pods:
    enabled: true
  spm:
    enabled: true
  branch:
    create: true
    push: true
  verify:
    local: true
    remote: true
    xcframework: true

# ============================================================================
# BRANCH ACCESS CONTROL POLICY
# ============================================================================
# Used by should_real_publish(), should_test_publish(), should_preflight_run()
# to determine what operations are allowed on the current branch.

branch_policy:
  rules:
    "release/.*":
      allow_real_publish: true
      allow_test_publish: true
      allow_preflight: true
    "main":
      allow_real_publish: true
      allow_test_publish: true
      allow_preflight: true
    "develop":
      allow_real_publish: true
      allow_test_publish: true
      allow_preflight: true
    "master":
      allow_real_publish: true
      allow_test_publish: true
      allow_preflight: true
    "feature/.*":
      allow_real_publish: true
      allow_test_publish: true
      allow_preflight: true
    "hotfix/.*":
      allow_real_publish: true
      allow_test_publish: true
      allow_preflight: true
