# NovaAdapter XcodeGen Project Specification
# Uses shared template and adds NovaAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: NovaAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: NovaAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.NovaAdapter
    PRODUCT_MODULE_NAME: NovaAdapter

targets:
  NovaAdapter:
    type: framework
    platform: iOS
    sources:
      - path: NovaAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "NovaAdapter.docc/**"
    dependencies:
      - framework: ../MSPSharedLibraries/MSPiOSCore.xcframework
        embed: false
      - framework: ../MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: NovaCore.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Framework Search Paths - Include MSPiOSCore, PrebidMobile, and NovaCore XCFrameworks
        # NovaAdapter depends on MSPiOSCore and PrebidMobile (in MSPSharedLibraries) and NovaCore (local to NovaAdapter folder)
        # NovaCore.xcframework is deployed to NovaAdapter/ by build_module.sh for legacy compatibility
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../MSPSharedLibraries/MSPiOSCore.xcframework
          - $(SRCROOT)/../MSPSharedLibraries/PrebidMobile.xcframework
          - $(SRCROOT)/NovaCore.xcframework
        
        # Swift Module Search Paths - Include Kingfisher
        # Kingfisher is a Pod dependency required by NovaAdapter (declared for NovaCore target)
        # The xcconfig may not include Kingfisher in SWIFT_INCLUDE_PATHS,
        # so we explicitly add it here to ensure the Swift compiler can find it during archive
        # Note: Pre-built Pods are in DerivedData/Build/Products, not in ArchiveIntermediates/BuildProductsPath
        # BUILD_DIR points to ArchiveIntermediates/NovaAdapter/BuildProductsPath
        # Products is at: BUILD_DIR/../../../../Products/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(PODS_CONFIGURATION_BUILD_DIR)/Kingfisher
          - $(BUILD_DIR)/../../../../Products/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/Kingfisher
          - $(PODS_CONFIGURATION_BUILD_DIR)/SnapKit
          - $(BUILD_DIR)/../../../../Products/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/SnapKit
        
        # Library Search Paths - Include Kingfisher and SnapKit static libraries
        # Kingfisher and SnapKit are static libraries that need to be linked
        # Add the paths where libKingfisher.a and libSnapKit.a are located
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PODS_CONFIGURATION_BUILD_DIR)/Kingfisher
          - $(PODS_CONFIGURATION_BUILD_DIR)/SnapKit
          - $(BUILD_DIR)/../../../../Products/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)
        
        # Link Kingfisher and SnapKit static libraries
        # This is required for the modules to be loadable during archive builds
        OTHER_LDFLAGS: $(inherited) -l"Kingfisher" -l"SnapKit"
    configFiles:
      Debug: "../Pods/Target Support Files/Pods-NovaAdapter/Pods-NovaAdapter.debug.xcconfig"
      Release: "../Pods/Target Support Files/Pods-NovaAdapter/Pods-NovaAdapter.release.xcconfig"
    prebuildScripts:
      - name: "[CP] Check Pods Manifest.lock"
        script: |
          if [ -z "${PODS_PODFILE_DIR_PATH}" ] || [ -z "${PODS_ROOT}" ]; then
            echo "error: CocoaPods environment variables are not set." >&2
            exit 1
          fi
          if [ ! -e "${PODS_ROOT}/Manifest.lock" ] || [ ! -e "${PODS_PODFILE_DIR_PATH}/Podfile.lock" ]; then
            echo "error: Run 'pod install' to generate Pods/Manifest.lock." >&2
            exit 1
          fi
          if ! diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" >/dev/null; then
            echo "error: The sandbox is not in sync with the Podfile.lock. Run 'pod install' or update your CocoaPods installation." >&2
            exit 1
          fi
        shell: /bin/sh
        inputFiles:
          - ${PODS_PODFILE_DIR_PATH}/Podfile.lock
          - ${PODS_ROOT}/Manifest.lock
    postbuildScripts:
      - name: "[CP] Copy Pods Resources"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-NovaAdapter/Pods-NovaAdapter-resources.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-NovaAdapter/Pods-NovaAdapter-resources.sh"
          fi
        shell: /bin/sh
      - name: "[CP] Embed Pods Frameworks"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-NovaAdapter/Pods-NovaAdapter-frameworks.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-NovaAdapter/Pods-NovaAdapter-frameworks.sh"
          fi
        shell: /bin/sh

schemes:
  NovaAdapter:
    build:
      targets:
        NovaAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
