# NovaCore XcodeGen Project Specification
# Uses shared template and adds NovaCore-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: NovaCore

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: NovaCore
    PRODUCT_BUNDLE_IDENTIFIER: msp.NovaCore
    PRODUCT_MODULE_NAME: NovaCore
    
    # Framework Search Paths
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../MSPOMSDK/OMSDK_Newsbreak1.xcframework

targets:
  NovaCore:
    type: framework
    platform: iOS
    sources:
      - path: NovaCore
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "NovaCore.docc/**"
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        # xcconfig defines these relative to NovaCore/, but we need repo root
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Module-specific Swift flags
        OTHER_SWIFT_FLAGS: $(inherited) -no-verify-emitted-module-interface
    configFiles:
      Debug: "../Pods/Target Support Files/Pods-NovaCore/Pods-NovaCore.debug.xcconfig"
      Release: "../Pods/Target Support Files/Pods-NovaCore/Pods-NovaCore.release.xcconfig"
    prebuildScripts:
      - name: "[CP] Check Pods Manifest.lock"
        script: |
          if [ -z "${PODS_PODFILE_DIR_PATH}" ] || [ -z "${PODS_ROOT}" ]; then
            echo "error: CocoaPods environment variables are not set." >&2
            exit 1
          fi
          if [ ! -e "${PODS_ROOT}/Manifest.lock" ] || [ ! -e "${PODS_PODFILE_DIR_PATH}/Podfile.lock" ]; then
            echo "error: Run 'pod install' to generate Pods/Manifest.lock." >&2
            exit 1
          fi
          if ! diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" >/dev/null; then
            echo "error: The sandbox is not in sync with the Podfile.lock. Run 'pod install' or update your CocoaPods installation." >&2
            exit 1
          fi
        shell: /bin/sh
        inputFiles:
          - ${PODS_PODFILE_DIR_PATH}/Podfile.lock
          - ${PODS_ROOT}/Manifest.lock
    postbuildScripts:
      - name: "[CP] Copy Pods Resources"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-NovaCore/Pods-NovaCore-resources.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-NovaCore/Pods-NovaCore-resources.sh"
          fi
        shell: /bin/sh
      - name: "[CP] Embed Pods Frameworks"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-NovaCore/Pods-NovaCore-frameworks.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-NovaCore/Pods-NovaCore-frameworks.sh"
          fi
        shell: /bin/sh

schemes:
  NovaCore:
    build:
      targets:
        NovaCore: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
