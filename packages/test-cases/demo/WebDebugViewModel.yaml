    priority: high
    tags: [behavior, validation, edge-case]
    given: ViewModel with empty history
    when: openURL with empty string
    then: return value is nil and recentURLs remains empty
    doubles: {}
    status: implemented
    file: Examples/MSPDemoApp/MSPDemoAppTests/WebDebugViewModelSpec.swift

  - id: WDB009
    type: behavior
    description: refreshClipboard sets clipboardURL when clipboard contains an http URL
    priority: high
    tags: [behavior, clipboard]
    given: "Clipboard contains http://localhost:3000"
    when: refreshClipboard is called
    then: "clipboardURL equals http://localhost:3000"
    doubles:
      clipboard:
        type: stub
        class: StubClipboard
        reason: Avoid real UIPasteboard access in tests
    status: implemented
    file: Examples/MSPDemoApp/MSPDemoAppTests/WebDebugViewModelSpec.swift

