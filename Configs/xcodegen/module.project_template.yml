# Global XcodeGen Project Template v2 for MSP iOS SDK Modules
# This template provides the shared foundation for all module project.yml files
#
# Template v2 Design:
#   - Consolidated all universal base settings
#   - Unified script phases with automatic existence checks
#   - Standardized xcconfig pattern
#   - Default scheme definition
#   - Clean override points for module-specific needs
#
# Usage:
#   Individual modules should include this template and provide only:
#   - name: <ModuleName>
#   - PRODUCT_NAME, PRODUCT_BUNDLE_IDENTIFIER, PRODUCT_MODULE_NAME
#   - Module-specific settings overrides (if needed)
#   - Sources path and excludes
#
# Template Variables:
#   Modules must define their own name, targets, and schemes
#   Template provides all base settings, script phases, and patterns

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"
  bundleIdPrefix: msp
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Platform Configuration
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    
    # Swift Configuration
    SWIFT_VERSION: "5.0"
    SWIFT_OPTIMIZATION_LEVEL: -O
    SWIFT_COMPILATION_MODE: wholemodule
    
    # Module Configuration
    DEFINES_MODULE: YES
    
    # Pure Swift Framework Settings (no ObjC bridging)
    # Turn framework into PURE Swift framework (no ObjC bridging layer)
    CLANG_ENABLE_MODULES: NO
    SWIFT_INSTALL_OBJC_HEADER: NO
    
    # Prevent Xcode from generating <Module>.h umbrella header
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: ""
    SWIFT_OBJC_INTERFACE_HEADER_NAME: ""
    SWIFT_OBJC_BRIDGING_HEADER: ""
    
    # Remove any leftover ObjC header exposure
    PUBLIC_HEADERS_FOLDER_PATH: ""
    PRIVATE_HEADERS_FOLDER_PATH: ""
    
    # Source root
    SRCROOT: $(PROJECT_DIR)
    
    # Build for Distribution (required for framework distribution)
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    
    # Framework Settings
    # Static framework for XCFramework distribution (avoids dynamic linking issues)
    MACH_O_TYPE: staticlib
    # DYLIB_INSTALL_NAME_BASE not needed for static frameworks
    INSTALL_PATH: $(LOCAL_LIBRARY_DIR)/Frameworks
    SKIP_INSTALL: NO
    
    # Code Signing (can be overridden)
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    
    # Header Search Paths - inherit from CocoaPods xcconfig
    HEADER_SEARCH_PATHS: $(inherited)
    
    # Framework Search Paths - base path, modules can override
    FRAMEWORK_SEARCH_PATHS: $(inherited)
    
    # Library Search Paths
    LIBRARY_SEARCH_PATHS: $(inherited)
    
    # Runpath Search Paths
    LD_RUNPATH_SEARCH_PATHS: |
      $(inherited)
      @executable_path/Frameworks
      @loader_path/Frameworks

# Note: Individual modules must define:
#   - name
#   - settings.base.PRODUCT_NAME
#   - settings.base.PRODUCT_BUNDLE_IDENTIFIER
#   - settings.base.PRODUCT_MODULE_NAME
#   - targets.{ModuleName} (type, platform, sources, configFiles, script phases)
#   - schemes.{ModuleName}
#
# Template provides base settings only. Modules provide:
#   - Target-specific settings overrides
#   - Script phases (using standard pattern)
#   - xcconfig paths (using standard pattern)
#   - Scheme definitions (using standard pattern)
