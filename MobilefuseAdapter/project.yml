# MobilefuseAdapter XcodeGen Project Specification
# This file uses the shared module template and adds MobilefuseAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: MobilefuseAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: MobilefuseAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.MobilefuseAdapter
    PRODUCT_MODULE_NAME: MobilefuseAdapter

targets:
  MobilefuseAdapter:
    type: framework
    platform: iOS
    sources:
      - path: MobilefuseAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "MobilefuseAdapter.docc/**"
    settings:
      base:
        # Header Search Paths - inherit from CocoaPods xcconfig
        HEADER_SEARCH_PATHS: $(inherited)
        
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        # xcconfig defines these relative to MobilefuseAdapter/, but we need repo root
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Framework Search Paths - Include $(PROJECT_DIR) to find local XCFrameworks
        # MSPiOSCore.xcframework and other frameworks from MSPSharedLibraries
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)
    configFiles:
      Debug: "../Pods/Target Support Files/Pods-MobilefuseAdapter/Pods-MobilefuseAdapter.debug.xcconfig"
      Release: "../Pods/Target Support Files/Pods-MobilefuseAdapter/Pods-MobilefuseAdapter.release.xcconfig"
    prebuildScripts:
      - name: "[CP] Check Pods Manifest.lock"
        script: |
          if [ -z "${PODS_PODFILE_DIR_PATH}" ] || [ -z "${PODS_ROOT}" ]; then
            echo "error: CocoaPods environment variables are not set." >&2
            exit 1
          fi
          if [ ! -e "${PODS_ROOT}/Manifest.lock" ] || [ ! -e "${PODS_PODFILE_DIR_PATH}/Podfile.lock" ]; then
            echo "error: Run 'pod install' to generate Pods/Manifest.lock." >&2
            exit 1
          fi
          if ! diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" >/dev/null; then
            echo "error: The sandbox is not in sync with the Podfile.lock. Run 'pod install' or update your CocoaPods installation." >&2
            exit 1
          fi
        shell: /bin/sh
        inputFiles:
          - ${PODS_PODFILE_DIR_PATH}/Podfile.lock
          - ${PODS_ROOT}/Manifest.lock
    postbuildScripts:
      - name: "[CP] Copy Pods Resources"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-MobilefuseAdapter/Pods-MobilefuseAdapter-resources.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-MobilefuseAdapter/Pods-MobilefuseAdapter-resources.sh"
          fi
        shell: /bin/sh
      - name: "[CP] Embed Pods Frameworks"
        script: |
          if [ -f "${PODS_ROOT}/Target Support Files/Pods-MobilefuseAdapter/Pods-MobilefuseAdapter-frameworks.sh" ]; then
            "${PODS_ROOT}/Target Support Files/Pods-MobilefuseAdapter/Pods-MobilefuseAdapter-frameworks.sh"
          fi
        shell: /bin/sh

schemes:
  MobilefuseAdapter:
    build:
      targets:
        MobilefuseAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

