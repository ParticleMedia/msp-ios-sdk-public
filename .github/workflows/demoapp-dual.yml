name: DemoApp Dual Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
  RUBY_VERSION: '3.1'

jobs:
  dual-build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Install Xcodegen
        run: brew install xcodegen

      - name: Generate workspace & project
        run: |
          chmod +x Scripts/update-workspace.sh
          CI=1 ./Scripts/update-workspace.sh

      - name: Validate Podspecs
        run: bundle exec fastlane validate_podspecs_comprehensive

      - name: Validate Swift packages
        run: |
          set -euo pipefail
          packages=(MSPCore MSPSharedLibraries MSPOMSDK PrebidAdapter NovaAdapter NovaCore MSPGoogleAdapter MSPFacebookAdapter MSPiOSCore)
          for pkg in "${packages[@]}"; do
            echo "::group::swift build $pkg"
            (cd "$pkg" && swift build --configuration release)
            echo "::endgroup::"
          done

      - name: Build MSPDemoApp (Pods scheme)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace msp-ios-sdk.xcworkspace \
            -scheme MSPDemoApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            SKIP_CODE_SIGN=YES \
            build

      - name: Test MSPDemoApp (Pods scheme)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace msp-ios-sdk.xcworkspace \
            -scheme MSPDemoApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            SKIP_CODE_SIGN=YES \
            test

      - name: Build MSPDemoApp-SPM scheme
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace msp-ios-sdk.xcworkspace \
            -scheme MSPDemoApp-SPM \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            SKIP_CODE_SIGN=YES \
            build
