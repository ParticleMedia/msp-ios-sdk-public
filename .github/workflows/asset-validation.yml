name: Asset Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'NovaCore/NovaCore/NBAssets.xcassets/**'
      - 'NovaCore/NovaCore/NBResourceBundle.bundle/**'
      - 'Scripts/lib/asset_*.sh'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'NovaCore/NovaCore/NBAssets.xcassets/**'
      - 'NovaCore/NovaCore/NBResourceBundle.bundle/**'
      - 'Scripts/lib/asset_*.sh'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Only validate assets (do not sync)'
        required: false
        default: 'false'
        type: boolean

jobs:
  validate-assets:
    name: Validate Asset Synchronization
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          
      - name: Install dependencies
        run: |
          bundle install
          bundle exec pod install --repo-update
          
      - name: Make scripts executable
        run: |
          chmod +x Scripts/lib/asset_sync.sh
          chmod +x Scripts/lib/asset_validation.sh
          
      - name: Sync assets (if not validate-only)
        if: ${{ !inputs.validate_only }}
        run: |
          echo "🔄 Synchronizing assets from NBAssets.xcassets to NBResourceBundle.bundle..."
          ./Scripts/lib/asset_sync.sh
          
      - name: Validate asset synchronization
        run: |
          echo "🔍 Validating asset synchronization..."
          ./Scripts/lib/asset_validation.sh --verbose --json --ci-mode
          
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-validation-report
          path: |
            /tmp/nova_asset_validation_*/validation_report.txt
            /tmp/nova_asset_validation_*/asset_sync_report.txt
          retention-days: 7
          
      - name: Comment on PR (if validation fails)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Try to find validation report
            const reportPath = '/tmp/nova_asset_validation_*/validation_report.txt';
            let reportContent = 'Asset validation failed. Please check the logs for details.';
            
            try {
              const { execSync } = require('child_process');
              const reportFiles = execSync(`find /tmp -name "validation_report.txt" -path "*/nova_asset_validation_*" 2>/dev/null || true`, { encoding: 'utf8' }).trim();
              
              if (reportFiles) {
                const reportFile = reportFiles.split('\n')[0];
                if (fs.existsSync(reportFile)) {
                  reportContent = fs.readFileSync(reportFile, 'utf8');
                }
              }
            } catch (error) {
              console.log('Could not read validation report:', error.message);
            }
            
            const comment = `## ❌ Asset Validation Failed
            
            The asset synchronization validation failed. This means that \`NBAssets.xcassets\` and \`NBResourceBundle.bundle\` are out of sync.
            
            ### What this means:
            - Assets in \`NBAssets.xcassets\` may not be available in the compiled bundle
            - This can cause production bugs where images fail to load
            - The build process will fail until assets are synchronized
            
            ### How to fix:
            1. Run the asset synchronization script:
               \`\`\`bash
               ./Scripts/lib/asset_sync.sh
               \`\`\`
            2. Verify the synchronization worked:
               \`\`\`bash
               ./Scripts/lib/asset_validation.sh --verbose
               \`\`\`
            3. Commit the updated \`NBResourceBundle.bundle\`
            
            ### Validation Report:
            \`\`\`
            ${reportContent}
            \`\`\`
            
            ---
            *This comment was automatically generated by the Asset Validation workflow.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  sync-assets:
    name: Sync Assets (Manual)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && !inputs.validate_only
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          
      - name: Install dependencies
        run: |
          bundle install
          bundle exec pod install --repo-update
          
      - name: Make scripts executable
        run: |
          chmod +x Scripts/lib/asset_sync.sh
          chmod +x Scripts/lib/asset_validation.sh
          
      - name: Sync assets
        run: |
          echo "🔄 Synchronizing assets from NBAssets.xcassets to NBResourceBundle.bundle..."
          ./Scripts/lib/asset_sync.sh
          
      - name: Validate synchronization
        run: |
          echo "🔍 Validating asset synchronization..."
          ./Scripts/lib/asset_validation.sh --verbose
          
      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync assets from NBAssets.xcassets to NBResourceBundle.bundle"
          title: "Asset Synchronization"
          body: |
            This PR automatically synchronizes assets from `NBAssets.xcassets` to `NBResourceBundle.bundle`.
            
            ### Changes:
            - Updated `NBResourceBundle.bundle` with latest assets from `NBAssets.xcassets`
            - Preserved existing non-asset files in the bundle
            - Generated new `Assets.car` with compiled assets
            
            ### Validation:
            - ✅ Asset synchronization completed successfully
            - ✅ All assets are properly synchronized
            - ✅ No missing or extra assets detected
            
            ---
            *This PR was automatically created by the Asset Validation workflow.*
          branch: asset-sync-$(date +%Y%m%d-%H%M%S)
          delete-branch: true
