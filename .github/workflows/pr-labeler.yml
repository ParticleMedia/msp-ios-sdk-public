name: PR Labeler

on:
  pull_request_target:
    branches:
      - main
      - develop
      - feature/newsbreak_msp_migration
    types:
      - opened
      - edited
      - reopened
      - synchronize
  pull_request:
    branches:
      - main
      - develop
      - feature/newsbreak_msp_migration
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  commit-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Label by commit keywords
        uses: actions/github-script@v7
        with:
          script: |
            const labelRules = [
              {
                label: 'bugfix',
                color: 'd73a4a',
                description: 'Bug fixes and hotfixes',
                patterns: [/bugfix/, /\bfix(e[ds])?\b/, /hotfix/]
              },
              {
                label: 'feature',
                color: 'a2eeef',
                description: 'New feature or major update',
                patterns: [/feature/, /\bfeat\b/, /new feature/]
              },
              {
                label: 'documentation',
                color: 'cfd3d7',
                description: 'Documentation or README updates',
                patterns: [/docs?/, /readme/, /documentation/]
              },
              {
                label: 'chore',
                color: 'fef2c0',
                description: 'Build chores and maintenance',
                patterns: [/chore/, /build:/]
              },
              {
                label: 'refactor',
                color: 'fbca04',
                description: 'Refactor-oriented changes',
                patterns: [/refactor/, /cleanup/]
              },
              {
                label: 'performance',
                color: 'a295d6',
                description: 'Performance optimizations',
                patterns: [/perf/, /performance/]
              }
            ];

            const pullNumber = context.payload.pull_request.number;
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                ...context.repo,
                pull_number: pullNumber,
                per_page: 100
              }
            );

            const matchedRules = new Map();
            for (const commit of commits) {
              const message = commit.commit.message.toLowerCase();
              for (const rule of labelRules) {
                if (matchedRules.has(rule.label)) {
                  continue;
                }
                const hit = rule.patterns.some((pattern) => pattern.test(message));
                if (hit) {
                  matchedRules.set(rule.label, rule);
                }
              }
            }

            if (matchedRules.size === 0) {
              core.info('No commit keywords matched, skipping label update.');
              return;
            }

            const ensureLabel = async (rule) => {
              try {
                await github.rest.issues.getLabel({
                  ...context.repo,
                  name: rule.label
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: rule.label,
                  color: rule.color,
                  description: rule.description
                });
                core.info(`Created missing label: ${rule.label}`);
              }
            };

            const labelNames = [...matchedRules.keys()];
            for (const rule of matchedRules.values()) {
              await ensureLabel(rule);
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: pullNumber,
              labels: labelNames
            });

            core.info(`Applied labels: ${labelNames.join(', ')}`);
