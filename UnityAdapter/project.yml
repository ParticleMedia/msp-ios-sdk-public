# UnityAdapter XcodeGen Project Specification
# Uses shared template and adds UnityAdapter-specific overrides
# Template: Config/xcodegen/module.project_template.yml

include:
  - ../Config/xcodegen/module.project_template.yml

name: UnityAdapter

settings:
  base:
    # Product Configuration
    PRODUCT_NAME: UnityAdapter
    PRODUCT_BUNDLE_IDENTIFIER: msp.UnityAdapter
    PRODUCT_MODULE_NAME: UnityAdapter

targets:
  UnityAdapter:
    type: framework
    platform: iOS
    sources:
      - path: UnityAdapter
        excludes:
          - "**/*.md"
          - "**/Tests/**"
          - "**/*.test.swift"
          - "**/*.spec.swift"
          - "UnityAdapter.docc/**"
    dependencies:
      - framework: ../MSPSharedLibraries/MSPiOSCore.xcframework
        embed: false
      - framework: ../MSPSharedLibraries/PrebidMobile.xcframework
        embed: false
      - framework: ../Pods/IronSourceSDK/IronSource/IronSource.xcframework
        embed: false
    settings:
      base:
        # CRITICAL: Override PODS_ROOT and PODS_PODFILE_DIR_PATH from xcconfig
        PODS_ROOT: $(SRCROOT)/../Pods
        PODS_PODFILE_DIR_PATH: $(SRCROOT)/..
        
        # Framework Search Paths - Include MSPiOSCore and PrebidMobile XCFrameworks
        # UnityAdapter depends on MSPiOSCore and PrebidMobile, which are located in MSPSharedLibraries
        # Xcode will automatically resolve the correct architecture slice from the XCFramework
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../MSPSharedLibraries/MSPiOSCore.xcframework
          - $(SRCROOT)/../MSPSharedLibraries/PrebidMobile.xcframework
          - $(PODS_ROOT)/IronSourceSDK/IronSource/IronSource.xcframework

schemes:
  UnityAdapter:
    build:
      targets:
        UnityAdapter: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
